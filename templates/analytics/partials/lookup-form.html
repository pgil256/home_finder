<form method="get" action="{% url 'lookup' %}" role="search" aria-label="Look up a home">
    <label for="lookup-q" class="{{ label_class|default:'label' }}">Street address or parcel ID</label>
    <div class="mt-2 flex flex-col gap-3 sm:flex-row">
        <input type="search"
               id="lookup-q"
               name="q"
               value="{{ query }}"
               required
               maxlength="120"
               autocomplete="off"
               {% if autofocus and not query %}autofocus{% endif %}
               placeholder="e.g., 1700 Gulf Blvd"
               class="input flex-1 text-charcoal-900">
        <button type="submit" class="btn btn-primary btn-lg">Look up</button>
    </div>
</form>
