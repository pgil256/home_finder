name: Refresh flood data

# Stores each parcel's FEMA flood zone and each ZIP code's flood-insurance
# claim history. FEMA revises a county's flood map rarely and adds claims
# after storms, so quarterly is plenty. The first run writes a zone on almost
# every property row; later runs only touch rows whose zone changed. Reading
# every parcel's coordinates costs about 20 MB of database egress.

on:
  schedule:
    - cron: "0 7 15 1,4,7,10 *"
  workflow_dispatch:

jobs:
  refresh:
    name: Flood zones and claim history
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-import-not-secret' }}
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-data.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-data.txt

      - name: Name this month's flood map cache
        id: month
        run: echo "key=nfhl-12103C-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # A rerun in the same month reuses the 30 MB download.
      - name: Cache FEMA flood zone polygons
        uses: actions/cache@v4
        with:
          path: nfhl-pinellas.geojson
          key: ${{ steps.month.outputs.key }}

      - name: Make sure the columns and table exist
        run: python manage.py migrate --noinput

      - name: Store flood zones and claim history
        run: python manage.py refresh_flood_data --zones-file nfhl-pinellas.geojson --vacuum-every 10

      - name: Purge Cloudflare's cached pages
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: .github/scripts/purge-cdn.sh homefinder.patbuilds.dev
