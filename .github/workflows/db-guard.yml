name: Database guard

# Rebuilds the county data if the property table is ever empty, then fails so
# the run gets noticed. When the data is there this is one small query a day.
# It runs before the daily E2E smoke (13:00 UTC), so the smoke checks the
# result of any rebuild.

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

jobs:
  guard:
    name: Rebuild if empty
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-import-not-secret' }}
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make sure the tables exist
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable

      - name: Rebuild the property data if it is gone
        run: python manage.py guard_property_data

      # This job fails on purpose after a rebuild, so say so somewhere a person
      # will see it.
      - name: Open or update an issue when the guard fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          .github/scripts/report-failure.sh
          "Database guard failed"
          "The daily database guard failed. Either the property table was empty
          and has been re-imported (the log says so), or the guard could not
          reach the database. Find out what emptied the table before closing this."
