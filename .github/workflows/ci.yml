name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.15.15

      - name: Run ruff check
        run: ruff check apps/ home_finder/

      - name: Run ruff format check
        run: ruff format --check apps/ home_finder/

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-data.txt pytest-cov

      - name: Run tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
        run: python -m pytest --cov=apps --cov-report=term-missing

  # The suite above runs on SQLite. Address lookup has a Postgres-only path
  # (the pg_trgm index and query behind typo correction), so those tests and
  # every migration also run against the database production uses.
  test-postgres:
    name: Python Tests (Postgres)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      # The runner image ships Postgres. Using it avoids pulling an image from
      # Docker Hub, whose anonymous rate limit fails jobs at random. The role
      # is named after the runner's user, so it connects over the local
      # socket with no password.
      - name: Start the runner's Postgres
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser "$USER"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run address lookup tests on Postgres
        env:
          SECRET_KEY: test-secret-key-for-ci
          DEBUG: "True"
          DATABASE_URL: postgres://%2Fvar%2Frun%2Fpostgresql/postgres
        run: >-
          python -m pytest --no-cov
          apps/analytics/tests/test_address_lookup.py
          apps/analytics/tests/test_guard_property_data.py

  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-js]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
