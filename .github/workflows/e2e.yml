name: E2E

on:
  # Smoke against production once a day, not every 4 hours.
  #
  # The insight endpoints this suite exercises each pull up to 50k rows out of
  # Neon. At 6 runs/day that alone was roughly 5 GB/month of egress, which is
  # the entire free-plan data transfer allowance -- the monitor was taking down
  # the thing it was monitoring. Daily keeps the signal without the bill.
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Override target URL (defaults to production)"
        required: false
        default: "https://homefinder.patbuilds.dev"
      run_exports:
        description: "Also run the export smoke tests (heavy: full table scan per export)"
        type: boolean
        default: false
      run_full_suite:
        description: "Also run functional + browser tests (writes to DB; requires E2E_DATABASE_URL secret)"
        type: boolean
        default: false

jobs:
  smoke:
    name: Smoke (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://homefinder.patbuilds.dev' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run smoke suite
        env:
          RUN_EXPORTS: ${{ github.event.inputs.run_exports || 'false' }}
        # The export tests are marked `heavy`: each one builds a workbook/PDF
        # over the whole filtered table, so they are opt-in rather than part of
        # the daily read-only smoke.
        run: |
          set -euo pipefail
          BASE_ARGS=(-c tests/e2e/pytest.ini --confcutdir=tests/e2e tests/e2e/test_smoke.py -v --no-header -p no:cacheprovider)
          if [ "$RUN_EXPORTS" = "true" ]; then
            python -m pytest "${BASE_ARGS[@]}"
          else
            python -m pytest "${BASE_ARGS[@]}" -m "not heavy"
          fi

      # The smoke failed two days running in October 2026 (the public domain
      # was serving an empty database) and nothing told anyone.
      - name: Open or update an issue when the smoke fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          .github/scripts/report-failure.sh
          "Production smoke failed"
          "The read-only smoke suite failed against $E2E_BASE_URL.
          If test_S0_has_data is the first failure, that host has no parcel data:
          check which Vercel project and database the domain points at before
          looking at application code."

  functional:
    name: Functional (write paths)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pytest psycopg2-binary

      - name: Run functional suite
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: >-
          python -m pytest
          -c tests/e2e/pytest.ini
          --confcutdir=tests/e2e
          tests/e2e/test_functional.py
          -v --no-header -p no:cacheprovider

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_suite == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pytest psycopg2-binary playwright pytest-playwright

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run browser suite
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url }}
          E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
        run: >-
          python -m pytest
          -c tests/e2e/pytest.ini
          --confcutdir=tests/e2e
          tests/e2e/browser/
          -v --no-header -p no:cacheprovider
